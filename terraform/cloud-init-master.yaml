#cloud-config
hostname: ${hostname}
manage_etc_hosts: true

# Set passwords for console access
chpasswd:
  users:
    - name: root
      password: ${console_password}
      type: text
    - name: debian
      password: ${console_password}
      type: text
  expire: false

# Enable console login
bootcmd:
  - echo "pts/0" >> /etc/securetty
  - echo "ttyS0" >> /etc/securetty

# Write configuration files
write_files:
- path: /etc/hosts
  content: |
    127.0.0.1 localhost
    ${master_ip} k8s-master
    ${worker_ip} k8s-worker01

- path: /etc/modules-load.d/k8s.conf
  content: |
    overlay
    br_netfilter

- path: /etc/sysctl.d/k8s.conf
  content: |
    net.bridge.bridge-nf-call-iptables = 1
    net.bridge.bridge-nf-call-ip6tables = 1
    net.ipv4.ip_forward = 1

- path: /root/init-cluster.sh
  permissions: '0755'
  content: |
    #!/bin/bash
    set -e
    
    echo "Initializing Kubernetes cluster..."
    kubeadm init \
      --pod-network-cidr=10.244.0.0/16 \
      --apiserver-advertise-address=${master_ip} \
      --control-plane-endpoint=${master_ip}
    
    echo "Configuring kubectl..."
    mkdir -p $HOME/.kube
    cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
    chown $(id -u):$(id -g) $HOME/.kube/config
    
    echo "Installing Flannel CNI..."
    kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
    
    echo "Generating join command..."
    kubeadm token create --print-join-command > /root/join-command.txt
    
    echo "Cluster initialized! Join command saved to /root/join-command.txt"

packages:
- qemu-guest-agent
- curl
- gnupg2
- software-properties-common
- apt-transport-https
- ca-certificates

runcmd:
  # Set passwords (ensure they work)
  - echo "root:${console_password}" | chpasswd
  - echo "debian:${console_password}" | chpasswd
  
  # Enable console auth
  - sed -i 's/^root:[*]/root:/' /etc/shadow || true
  
  # Disable swap
  - swapoff -a
  - sed -i '/ swap / s/^/#/' /etc/fstab
  
  # Load kernel modules
  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system
  
  # Install containerd
  - curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y containerd.io
  - containerd config default > /etc/containerd/config.toml
  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
  - systemctl restart containerd
  - systemctl enable containerd
  
  # Install Kubernetes
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.31/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
  - apt-get update
  - apt-get install -y kubelet kubeadm kubectl
  - apt-mark hold kubelet kubeadm kubectl
  - systemctl enable kubelet
  
  # Enable guest agent
  - systemctl enable --now qemu-guest-agent
  
  # Create MOTD
  - |
    cat > /etc/motd << 'MOTD'
    =====================================
    Kubernetes Master Node
    =====================================
    Hostname: ${hostname}
    IP: ${master_ip}
    
    Initialize cluster: /root/init-cluster.sh
    
    Console access: root/debian
    SSH access: debian@ with SSH key
    =====================================
    MOTD
